<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Halaman Tidak Dijumpai — KOPK</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap">
<link rel="stylesheet" href="styles.css?v=9">
<style>
  .notfound {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: var(--navy-950);
    color: #fff;
    padding: 24px;
  }
  .notfound__code {
    font-family: var(--font-mono);
    font-size: clamp(56px, 12vw, 120px);
    font-weight: 700;
    color: var(--gold-300);
    line-height: 1;
    margin: 0;
  }
  .notfound__title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(22px, 4vw, 32px);
    margin: 16px 0 8px;
  }
  .notfound__desc { color: rgba(255,255,255,0.65); font-size: 15px; margin: 0 0 32px; max-width: 40ch; }
  .notfound__btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #fff; color: var(--navy-950);
    font-weight: 600; font-size: 14.5px;
    padding: 13px 28px; border-radius: 100px; text-decoration: none;
    transition: transform 0.2s ease;
  }
  .notfound__btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="notfound">
  <p class="notfound__code">404</p>
  <h1 class="notfound__title">Halaman Tidak Dijumpai</h1>
  <p class="notfound__desc">Pautan yang anda cuba buka tiada atau telah dipindahkan. Jom kembali ke laman utama.</p>
  <a href="/" class="notfound__btn">← Kembali ke Laman Utama</a>
</div>
</body>
</html>
